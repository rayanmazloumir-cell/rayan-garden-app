name: rayan_garden
description: Rayan Garden premium customer booking app (Persian/English)
publish_to: 'none'
version: 1.0.6+6
environment:
  sdk: '>=3.3.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  url_launcher: ^6.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/images/rayan_garden_home.png
    - assets/images/rayan_garden_logo.jpg
    - assets/images/service_wedding.jpg
    - assets/images/service_formality.jpg
    - assets/images/service_children.jpg
    - assets/images/service_family.jpg
    - assets/images/service_cafe.jpg
