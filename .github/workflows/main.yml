name: Build Rayan Garden Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Locate Flutter project
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "$GITHUB_WORKSPACE/pubspec.yaml" ]; then
            PROJECT_DIR="$GITHUB_WORKSPACE"
          else
            ZIP_FILE="$(find "$GITHUB_WORKSPACE" -maxdepth 4 -type f \( -iname 'Rayan-Garden-Fixed.zip' -o -iname '*Rayan-Garden*Source*.zip' \) | head -n 1)"
            if [ -z "$ZIP_FILE" ]; then
              echo "::error::No pubspec.yaml at repository root and no recognized Rayan Garden source ZIP found."
              exit 1
            fi
            mkdir -p "$RUNNER_TEMP/rg_src"
            unzip -oq "$ZIP_FILE" -d "$RUNNER_TEMP/rg_src"
            PUBSPEC="$(find "$RUNNER_TEMP/rg_src" -type f -name pubspec.yaml -not -path '*/.*' | head -n 1)"
            if [ -z "$PUBSPEC" ]; then
              echo "::error::pubspec.yaml not found inside the uploaded ZIP."
              exit 1
            fi
            PROJECT_DIR="$(dirname "$PUBSPEC")"
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Flutter project: $PROJECT_DIR"
          test -d "$PROJECT_DIR/lib"
          ls -la "$PROJECT_DIR"

      - name: Generate Android platform files if missing
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          flutter --version
          mkdir -p "$RUNNER_TEMP/rg_backup"
          cp -a lib "$RUNNER_TEMP/rg_backup/lib"
          cp pubspec.yaml "$RUNNER_TEMP/rg_backup/pubspec.yaml"

          if [ ! -f android/app/build.gradle ] && [ ! -f android/app/build.gradle.kts ]; then
            flutter create --platforms=android --org com.rayangarden --project-name rayan_garden .
          fi

          rm -rf lib
          cp -a "$RUNNER_TEMP/rg_backup/lib" lib
          cp "$RUNNER_TEMP/rg_backup/pubspec.yaml" pubspec.yaml

          if [ ! -f android/app/build.gradle ] && [ ! -f android/app/build.gradle.kts ]; then
            echo "::error::Android Gradle build file is missing after platform generation."
            exit 1
          fi
          test -f android/app/src/main/AndroidManifest.xml

      - name: Configure app label and internet permission
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="[^"]*"/android:label="Rayan Garden"/' "$MANIFEST"
          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i '0,/<application/s//<uses-permission android:name="android.permission.INTERNET"\/>\n    <application/' "$MANIFEST"
          fi

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: Analyze (non-blocking)
        working-directory: ${{ env.PROJECT_DIR }}
        continue-on-error: true
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Rayan-Garden-Android-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
