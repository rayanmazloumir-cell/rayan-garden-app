
name: Build Rayan Garden Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: rayan-garden-android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract Flutter project
        shell: bash
        run: |
          set -e
          ZIP_FILE="Rayan-Garden-Fixed.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE was not found in repository root."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/rayan-garden"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/rayan-garden"

          PUBSPEC=$(find "$RUNNER_TEMP/rayan-garden" -name pubspec.yaml -type f | head -n 1)

          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: pubspec.yaml not found in ZIP."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Flutter project found at: $PROJECT_DIR"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform if missing
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          if [ ! -d android ]; then
            cp pubspec.yaml "$RUNNER_TEMP/pubspec.yaml.backup"

            if [ -d lib ]; then
              cp -a lib "$RUNNER_TEMP/lib.backup"
            fi

            if [ -d assets ]; then
              cp -a assets "$RUNNER_TEMP/assets.backup"
            fi

            flutter create --platforms=android --project-name rayan_garden .

            cp "$RUNNER_TEMP/pubspec.yaml.backup" pubspec.yaml

            if [ -d "$RUNNER_TEMP/lib.backup" ]; then
              rm -rf lib
              cp -a "$RUNNER_TEMP/lib.backup" lib
            fi

            if [ -d "$RUNNER_TEMP/assets.backup" ]; then
              rm -rf assets
              cp -a "$RUNNER_TEMP/assets.backup" assets
            fi
          fi

      - name: Build APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          flutter pub get
          flutter build apk --release

          APK="$PROJECT_DIR/build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Release APK was not generated."
            exit 1
          fi

          echo "APK successfully generated."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Rayan-Garden-Android-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          
